<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/icon/bench-icon-ver0.3.0/bench.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/bench-icon-ver0.3.0/32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/bench-icon-ver0.3.0/16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/bench-icon-ver0.3.0/128x128.png" />
    <title>Bench</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="title-bar">
      <div class="title-bar-drag" data-tauri-drag-region>
        <img src="assets/icon/bench-icon-ver0.3.0/32x32.png" alt="" class="titlebar-icon" />
        <span class="titlebar-logo">bench</span>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-action-btn" id="btn-guide" aria-label="Bench Guide" title="Bench Guide">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <button class="titlebar-action-btn" id="btn-shortcuts" aria-label="Keyboard Shortcuts" title="Keyboard Shortcuts">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide"><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M6 10h.01"/><path d="M10 10h.01"/><path d="M14 10h.01"/><path d="M18 10h.01"/><path d="M6 14h.01"/><path d="M18 14h.01"/><path d="M10 14h8"/></svg>
        </button>
        <button class="win-btn" id="win-min" aria-label="minimize">
          <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="win-max" aria-label="maximize">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
        </button>
        <button class="win-btn" id="win-close" aria-label="close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>
    <div class="app-container">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <div class="sidebar-nav-primary">
            <a href="#" class="nav-item" data-module="focus">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">λ</span></span>
              <span class="nav-label">Focus</span>
              <span class="nav-shortcut">⌥1</span>
            </a>
            <a href="#" class="nav-item" data-module="capture">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">κ</span></span>
              <span class="nav-label">Capture</span>
              <span class="nav-shortcut">⌥2</span>
            </a>
            <a href="#" class="nav-item" data-module="areas">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">α</span></span>
              <span class="nav-label">Areas</span>
              <span class="nav-shortcut">⌥3</span>
            </a>
            <a href="#" class="nav-item" data-module="parking-lot">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">π</span></span>
              <span class="nav-label">Parking Lot</span>
              <span class="nav-shortcut">⌥4</span>
            </a>
            <a href="#" class="nav-item" data-module="archive">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">Ω</span></span>
              <span class="nav-label">Archive</span>
              <span class="nav-shortcut">⌥5</span>
            </a>
            <a href="#" class="nav-item" data-module="jot">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">ν</span></span>
              <span class="nav-label">Jot</span>
              <span class="nav-shortcut">⌥6</span>
            </a>
            <a href="#" class="nav-item" data-module="recap">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">Σ</span></span>
              <span class="nav-label">Log</span>
              <span class="nav-shortcut">⌥7</span>
            </a>
            <a href="#" class="nav-item" data-module="clips">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><span class="bench-symbol">γ</span></span>
              <span class="nav-label">Clips</span>
              <span class="nav-shortcut">⌥8</span>
            </a>
          </div>
          <div class="sidebar-nav-utility">
            <a href="#" class="nav-item" data-module="settings">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
              <span class="nav-label">Settings</span>
              <span class="nav-shortcut">⌘J</span>
            </a>
            <button class="nav-item" id="sidebar-toggle" aria-label="Collapse sidebar">
              <span class="nav-indicator"></span>
              <span class="nav-icon-container"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide toggle-icon"><polyline points="15 18 9 12 15 6"/></svg></span>
              <span class="nav-label">Collapse</span>
              <span class="nav-shortcut">⌘L</span>
            </button>
          </div>
        </nav>
      </aside>

      <!-- Main Panel with Title and Content -->
      <main class="main-content">
        <header class="title-area">
          <h1 id="view-title">Focus</h1>
        </header>
        <section class="panel-primary" id="active-view"></section>
      </main>

      <!-- Inspector Panel (right side) -->
      <aside class="inspector-panel" id="inspector-panel"></aside>
    </div>
    <!-- Portals for overlays and notifications -->
    <div id="toast-portal"></div>
    <div id="overlay-portal"></div>
  </body>
</html>
